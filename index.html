<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цифровая визитка</title>
    <style>
        :root {
            --primary-teal: #0F766E;
            --bg-gradient: linear-gradient(135deg, #F0FDFA 0%, #CCFBF1 100%);
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-sub: #475569;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-container {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(15, 118, 110, 0.1);
            text-align: center;
        }

        .profile-photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary-teal);
            margin-bottom: 15px;
        }

        h1 { font-size: 1.4rem; margin: 0 0 5px 0; color: var(--text-main); }
        .role { font-size: 0.95rem; color: var(--primary-teal); font-weight: 600; margin-bottom: 5px; }
        .clinic { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 20px; }

        .btn-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            color: #FFFFFF;
            background-color: var(--primary-teal);
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.9; }
        .btn svg { width: 20px; height: 20px; fill: currentColor; }

        .btn-vcard {
            background-color: #0284C7;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="card-container">
    <img id="doctor-photo" class="profile-photo" src="" alt="Фото профиля">
    <h1 id="doctor-name">Загрузка...</h1>
    <div id="doctor-role" class="role"></div>
    <div id="clinic-name" class="clinic"></div>

    <div class="btn-list" id="buttons-container"></div>

    <button id="vcard-btn" class="btn btn-vcard" onclick="downloadVCard()">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm6 12H6v-1c0-2 4-3.1 6-3.1s6 1.1 6 3.1v1z"/></svg>
        Сохранить контакт
    </button>
</div>

<script>
    let cardData = {};

    async function initCard() {
        // Проверяем наличие отредактированных данных в localStorage, иначе грузим data.json
        const local = localStorage.getItem('dentalCardData');
        if (local) {
            cardData = JSON.parse(local);
            renderCard();
        } else {
            try {
                const res = await fetch('data.json');
                cardData = await res.json();
                renderCard();
            } catch (e) {
                console.error("Ошибка загрузки данных", e);
            }
        }
    }

    function renderCard() {
        document.getElementById('doctor-name').innerText = cardData.name || '';
        document.getElementById('doctor-role').innerText = cardData.role || '';
        document.getElementById('clinic-name').innerText = cardData.clinic || '';
        if (cardData.photo) {
            document.getElementById('doctor-photo').src = cardData.photo;
        }

        const container = document.getElementById('buttons-container');
        container.innerHTML = '';

        if (cardData.buttons && Array.isArray(cardData.buttons)) {
            cardData.buttons.forEach(btn => {
                const a = document.createElement('a');
                a.className = 'btn';
                a.href = btn.url;
                a.target = '_blank';
                if (btn.color) a.style.backgroundColor = btn.color;

                let iconHtml = btn.svgIcon || '<svg viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>';
                a.innerHTML = `${iconHtml} <span>${btn.label}</span>`;
                container.appendChild(a);
            });
        }
    }

    // Динамическое формирование и скачивание VCF файла
    function downloadVCard() {
        const name = cardData.name || 'Врач';
        const phone = cardData.phone || '';
        const email = cardData.email || '';
        const clinic = cardData.clinic || '';
        const role = cardData.role || '';

        const vcardContent = 
`BEGIN:VCARD
VERSION:3.0
FN:${name}
ORG:${clinic}
TITLE:${role}
TEL;TYPE=CELL:${phone}
EMAIL:${email}
END:VCARD`;

        const blob = new Blob([vcardContent], { type: 'text/vcard;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `${name.replace(/\s+/g, '_')}.vcf`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    initCard();
</script>

</body>
</html>
